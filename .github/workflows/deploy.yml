name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            echo "Connected OK"
            cd /opt/africa/africa-backend
            git config --global --add safe.directory /opt/africa/africa-backend
            git fetch origin main
            git pull origin main
            chmod +x gradlew
            ./gradlew clean :app:bootJar || exit 1
            sudo systemctl restart africa-backend
            sleep 5
            sudo systemctl is-active africa-backend
